[project]
name = "central-de-salas-agente"
version = "1.0.0"
description = "Agente A2A da Central de Salas, host MCP por dentro. Sem LLM."
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]==1.2.1",
    "httpx==0.28.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
